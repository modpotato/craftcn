[package]
name = "craftcn"
version = "0.2.0"
edition = "2021"
description = "A shadcn/ui for Minecraft Plugins - CLI tool for scaffolding UI primitives"
authors = ["modpotato"]
repository = "https://github.com/modpotato/craftcn"
license = "GPL-3.0-only"
keywords = ["minecraft", "papermc", "ui", "cli", "scaffolding"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
colored = "2.1"
directories = "5.0"
minijinja = { version = "1.0", features = ["loader", "builtins"] }
regex = "1.10"
dialoguer = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha1 = "0.10"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "craftcn"
path = "src/main.rs"
